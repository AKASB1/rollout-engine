[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rollout-engine"
version = "0.2.0"
description = "Deterministic simulator, scheduling policies, and a small live service for the rollout side of RL post-training."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=7.4", "pytest-repeat>=0.9", "ruff>=0.6", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: longer statistical or exhaustive checks (still part of the default run)"]
