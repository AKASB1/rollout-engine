[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rollout-engine"
version = "0.1.0"
description = "Distributed rollout service for RL post-training workloads."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "redis>=5",
]

[project.optional-dependencies]
runtime = ["ray>=2.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
