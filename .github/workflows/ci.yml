name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Quick benchmark
        run: python -m rollout_engine.bench --quick --workers 2 --out benchmarks/outputs/ci-quick
      - name: Demo
        run: python -m rollout_engine.service.demo --port 0
